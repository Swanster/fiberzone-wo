<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiberzone WO Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <h1>Fiberzone WO Dashboard</h1>
    <div id="stats-chips" class="chips"></div>
  </div>
  <div id="demo-banner" class="banner demo hidden">Mode Demo — backend belum terhubung. Data contoh lokal.</div>
  <div id="error-banner" class="banner error hidden"></div>
</header>

<nav id="tabs" class="tabs" aria-label="Status WO">
  <button class="tab active" data-status="masuk" id="tab-masuk">Masuk <span class="tab-count"></span></button>
  <button class="tab" data-status="dikerjakan" id="tab-dikerjakan">Dikerjakan <span class="tab-count"></span></button>
  <button class="tab" data-status="menunggu_verifikasi" id="tab-menunggu_verifikasi">Menunggu Verifikasi <span class="tab-count"></span></button>
  <button class="tab" data-status="done" id="tab-done">Done <span class="tab-count"></span></button>
  <button class="tab" data-status="klien" id="tab-klien">🌐 Data Klien <span class="tab-count"></span></button>
</nav>

<div class="toolbar" id="wo-toolbar">
  <input id="search-input" type="search" placeholder="Cari No. WO, nama, alamat, telepon">
  <select id="type-select">
    <option value="all">Semua Tipe</option>
    <option value="P">PSB</option>
    <option value="M">Maintenance</option>
    <option value="T">Troubleshoot</option>
    <option value="D">Dismantle</option>
    <option value="B">Bangun Jaringan</option>
    <option value="S">Survey</option>
  </select>
  <button id="btn-add" class="btn primary">+ Tambah WO</button>
</div>

<main id="cards" class="cards" aria-live="polite"></main>

<div class="toolbar klien-toolbar hidden" id="klien-toolbar">
  <input id="kq" type="search" placeholder="Cari nama klien, Client ID, FDT / FAT">
  <select id="kpop"><option value="">Semua POP</option></select>
  <select id="kfdt"><option value="">Semua FDT</option></select>
  <select id="kfat"><option value="">Semua FAT</option></select>
  <select id="kstatus">
    <option value="">Semua Status</option>
    <option value="ACTIVE">Aktif</option>
    <option value="DISCONNECT">Disconnect</option>
  </select>
  <select id="ktipe">
    <option value="">Semua Tipe</option>
    <option value="CLIENT">Client</option>
    <option value="MINIFZ">MiniFZ</option>
    <option value="VSL">Vessel</option>
    <option value="CLIENT_NOID">Client (no ID)</option>
  </select>
  <select id="kview">
    <option value="klien">Per Klien</option>
    <option value="struktur">Per FDT / FAT</option>
  </select>
  <button id="ksync" class="btn ghost">↻ Sync</button>
</div>
<p id="klien-meta" class="dim klien-meta hidden"></p>
<div id="klien-stats" class="chips klien-stats hidden"></div>
<main id="klien-cards" class="cards hidden" aria-live="polite"></main>

<div id="toast-container" class="toast-container"></div>

<div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button id="modal-close" class="modal-x" aria-label="Tutup">&times;</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<div id="add-modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-head">
      <h2>Tambah WO (paste pesan)</h2>
      <button id="add-cancel" class="modal-x" aria-label="Tutup">&times;</button>
    </div>
    <div class="modal-body">
      <textarea id="add-text" rows="12" placeholder="Tempel pesan WO dari chat di sini..."></textarea>
      <button id="add-submit" class="btn primary">Simpan</button>
    </div>
  </div>
</div>

<div id="report-form-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-head">
      <h2 id="report-form-title">Isi Report</h2>
      <button id="report-form-cancel" class="modal-x" aria-label="Tutup">&times;</button>
    </div>
    <div class="modal-body">
      <div id="report-form-wo" class="kw"><span></span><span></span></div>
      <div class="form-grid">
        <label>Status Report *
          <select id="rf-status">
            <option value="Cleared">Cleared</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </label>
        <label>Tanggal Laporan
          <input type="date" id="rf-date">
        </label>
        <label>PIC Teknisi
          <input type="text" id="rf-pic" placeholder="nama teknisi">
        </label>
        <label>PIC Pendamping
          <input type="text" id="rf-pic-pendamping" placeholder="nama pendamping">
        </label>
        <label>Start
          <input type="time" id="rf-start">
        </label>
        <label>Finish
          <input type="time" id="rf-finish">
        </label>
        <label>Tarik
          <input type="text" id="rf-tarik" placeholder="ok / -">
        </label>
        <label>Aktivasi
          <input type="text" id="rf-aktivasi" placeholder="ok / -">
        </label>
        <label>SN ONT
          <input type="text" id="rf-sn" placeholder="ALCLB...">
        </label>
        <label>Username
          <input type="text" id="rf-username">
        </label>
        <label>Password
          <input type="text" id="rf-password">
        </label>
      </div>
      <label>Case <span class="dim">(satu item per baris)</span>
        <textarea id="rf-case" rows="3" placeholder="- temuan masalah"></textarea>
      </label>
      <label>Action <span class="dim">(satu item per baris)</span>
        <textarea id="rf-action" rows="3" placeholder="- tindakan yang dilakukan"></textarea>
      </label>
      <label>Solution <span class="dim">(satu item per baris)</span>
        <textarea id="rf-solution" rows="3" placeholder="- solusi akhir"></textarea>
      </label>
      <label>Meteran <span class="dim">(satu item per baris)</span>
        <textarea id="rf-meteran" rows="2" placeholder="Tarikan awal - meter"></textarea>
      </label>
      <label>Splitter <span class="dim">(satu item per baris)</span>
        <textarea id="rf-splitter" rows="2" placeholder="SOLITER / FADPS-FDT10-FAT0"></textarea>
      </label>
      <label>Alat Terpasang <span class="dim">(satu item per baris)</span>
        <textarea id="rf-alat" rows="3" placeholder="- Patchcore Biru 1 Pcs"></textarea>
      </label>
      <label>Splicer <span class="dim">(satu item per baris)</span>
        <textarea id="rf-splicer" rows="2" placeholder="Said : Likkho"></textarea>
      </label>
      <button id="report-form-save" class="btn primary">Simpan Report</button>
    </div>
  </div>
</div>

<div id="paste-report-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-head">
      <h2>Paste Report (dari chat)</h2>
      <button id="paste-report-cancel" class="modal-x" aria-label="Tutup">&times;</button>
    </div>
    <div class="modal-body">
      <div id="paste-report-wo" class="kw"><span></span><span></span></div>
      <p class="dim">Tempel teks report dari chat. WO akan langsung <strong>done</strong> dan report bisa diedit setelahnya.</p>
      <textarea id="paste-text" rows="14" placeholder="Repot pasang baru&#10;&#10;WO/260810/P01/...&#10;..."></textarea>
      <button id="paste-report-save" class="btn primary">Simpan & Selesai</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
